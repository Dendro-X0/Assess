name = "assess-api"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "assess-db"
database_id = "REPLACE_AFTER_CREATE"
migrations_dir = "migrations"

[vars]
CORS_ORIGINS = "http://localhost:5173,http://localhost:8787"
SIGNUP_RATE_PER_HOUR = "5"

# Secrets (set via `wrangler secret put`):
# API_KEY_PEPPER, GITHUB_TOKEN, POLAR_WEBHOOK_SECRET, POLAR_CHECKOUT_URL

[dev]
port = 8787
local_protocol = "http"
